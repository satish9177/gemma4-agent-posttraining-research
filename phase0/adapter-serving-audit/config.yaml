# Phase 0 adapter-serving audit: planned configuration (DRAFT, not frozen, not run)
# Model revisions, package versions and file hashes are filled in and frozen immediately before the run.

stage_a:
  model: google/gemma-4-12B-it        # fallback: google/gemma-4-E4B-it (record the reason if used)
  model_revision: null                # pin to a Hugging Face commit hash at freeze time
  dtype: bfloat16
stage_b:
  model: google/gemma-4-31B-it
  model_revision: null
  dtype: bfloat16

adapters:
  A1_marker:
    rank: 8
    alpha: 16
    dropout: 0.0
    steps: 200
    learning_rate: 1.0e-4
    data: synthetic_marker_prompts      # generated by the audit code; fixed seed
  A2_diffuse:
    rank: 32
    alpha: 64
    dropout: 0.05
    steps: 200
    learning_rate: 2.0e-5
    data: openly_licensed_instructions  # exact dataset and revision pinned at freeze
  A3_naive_targets:
    inherit: A2_diffuse
    target_modules_by_name: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

targets:
  scope: language_model_only            # exclude vision/audio towers
  projections: [q_proj, k_proj, o_proj, gate_proj, up_proj, down_proj]
  v_proj: only_where_present            # Gemma 4 global layers have no v_proj
  enumerate_from_live_model: true
  assert_counts: true

serving_paths:
  P1: {engine: transformers_peft, merged: false, role: reference}
  P2: {engine: transformers, merged: true}
  P3: {engine: vllm, runtime_lora: true}
  P4: {engine: vllm, merged: true}
  P5: {engine: vllm, runtime_lora: true, base_quantization: fp8, descriptive_only: true}
  P6: {engine: vllm, runtime_lora: true, base_quantization: qat_w4a16, descriptive_only: true}

prompts:
  n_general: 250
  n_agent_format: 250                   # thinking-enabled system turn, tool schema, 1-3 prior tool turns
  continuation_tokens: 64
  source_license_requirement: open      # no restricted benchmark content
  seed: 20261027

metrics:
  M2_retention_min_abs_delta_nats: 0.1
  M2_pass_median_range: [0.95, 1.05]
  M3_top1_agreement_min: 0.990
  M4_kl_topk: 20
  M4_kl_median_max_nats: 0.01
  M5_greedy_prompts: 50
  M5_greedy_tokens: 128
  M6_marker_rate_min: 0.95
  M6_separation_factor_min: 10
  M7_batch_sizes: [1, 16]
  M7_prompt_tokens: 512
  M7_generate_tokens: 256

record_environment: [gpu, driver, cuda, torch, transformers, peft, vllm, model_sha, adapter_sha, prompts_sha]
