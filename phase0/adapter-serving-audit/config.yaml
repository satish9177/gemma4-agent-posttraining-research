# Phase 0 adapter-serving audit: configuration (v1, Stage A). Frozen with PREREGISTRATION.md (FREEZE.json).
# The executable values live in audit_modal.py and analyze_audit.py; this file mirrors them for readers.

stage_a:
  model: google/gemma-4-12B-it
  model_revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
  license: apache-2.0           # not gated
  dtype: bfloat16
stage_b:                        # deferred; must run before any 31B study work
  model: google/gemma-4-31B-it
  model_revision: null

environment:
  python: "3.12"
  vllm: 0.32.0
  torch: 2.13.0
  transformers: 5.19.0
  peft: 0.21.2
  accelerate: 1.15.0
  compute: modal, 1x A100-80GB per GPU step   # list price $2.50/GPU-hour (modal billing rates, 2026-10-28)
  step_timeouts_hours: {train: 2, hf: 3, vllm_lora: 1.5, vllm_merged_each: 1}   # worst case 8.5 GPU-h, about $21
  model_access: anonymous Hugging Face download (public, not gated); no token, no Modal secret
vllm_engine: {max_model_len: 4096, gpu_memory_utilization: 0.80, enable_prefix_caching: false, max_lora_rank: 32,
              max_loras: 1, seed: 0}

expected_targets:
  layers: 48
  global_layers_without_v_proj: 8   # attention_k_eq_v = true
  count: 328                        # 48 x 6 + 40 v_proj

adapters:
  A1_marker:   {rank: 8,  alpha: 16, dropout: 0.0,  steps: 200, batch: 8, learning_rate: 2.0e-4, data: train_marker.jsonl,  marker: ZQX-AUDIT-MARKER, targets: enumerated_328}
  A2_diffuse:  {rank: 32, alpha: 64, dropout: 0.05, steps: 200, batch: 8, learning_rate: 5.0e-5, data: train_diffuse.jsonl, targets: enumerated_328}
  A3_naive:    {rank: 32, alpha: 64, dropout: 0.05, steps: 20,  batch: 8, learning_rate: 5.0e-5, data: train_diffuse.jsonl,
                targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj], gate: false}
  seed: 20261027

serving_paths:
  P1: {engine: transformers_peft, merged: false, role: reference}
  P2: {engine: transformers, merged: true}
  P3: {engine: vllm, runtime_lora: true}
  P4: {engine: vllm, merged: true}
  P5: deferred   # vllm runtime LoRA on FP8 base (descriptive)
  P6: deferred   # vllm runtime LoRA on QAT W4A16 base (descriptive)

prompts:
  n_general: 250                  # databricks/databricks-dolly-15k @ bdd27f4d (CC BY-SA 3.0)
  n_agent_format: 250             # SWE-bench-Live @ b51a8642 issue texts (MIT); thinking on; 1-3 prior tool turns
  continuation_tokens: 64         # base HF greedy, cut after first end-of-turn token
  top_k_logprobs: 20
  seed: 20261027

gate:
  G1_expected_modules: 328
  G2_rho_band: [0.95, 1.05]       # P3 vs P1 and P3 vs P4; tokens with |delta_ref| >= 0.1 nats
  G3_top1_min: 0.990              # within vLLM, P3 vs P4
  G3_kl_median_max_nats: 0.01
  G4_marker_rate_min: 0.95        # P1, P3, P4; 50 general prompts x 128 greedy tokens
  G4_separation_factor_min: 10
  merge_check: {rho_band: [0.95, 1.05], top1_min: 0.990, kl_median_max_nats: 0.01}

throughput: {batch_sizes: [1, 16], prompt_tokens: 512, generate_tokens: 256}
